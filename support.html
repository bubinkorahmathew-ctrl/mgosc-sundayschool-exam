<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Support - MGOSC Sunday School Exam Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');
    :root{--bg:#faf6ec;--surface:#ffffff;--surface-2:#f1e8d6;--ink:#2a1e14;--muted:#7a6c58;--border:#e4d8bf;--accent7:#7b1e2b;--accent6:#1f5c4d;--accent5:#235482;--accent10:#b45309;--accent12:#5b21b6;--gold:#a97a26;--shadow:0 18px 40px -20px rgba(42,30,20,.35);}
    @media (prefers-color-scheme: dark){:root:not([data-theme='light']){--bg:#141210;--surface:#1d1a16;--surface-2:#252019;--ink:#f1e6d3;--muted:#b8a68b;--border:#3c342a;--accent7:#e0929c;--accent6:#7fc9a9;--accent5:#6ea8dc;--accent10:#f59e0b;--accent12:#c084fc;--gold:#dcb567;--shadow:0 18px 40px -20px rgba(0,0,0,.6);}}
    :root[data-theme='dark']{--bg:#141210;--surface:#1d1a16;--surface-2:#252019;--ink:#f1e6d3;--muted:#b8a68b;--border:#3c342a;--accent7:#e0929c;--accent6:#7fc9a9;--accent5:#6ea8dc;--accent10:#f59e0b;--accent12:#c084fc;--gold:#dcb567;--shadow:0 18px 40px -20px rgba(0,0,0,.6);}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;padding:2rem;display:flex;justify-content:center;}
    .wrap{max-width:800px;width:100%;text-align:center;}
    h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:2rem;margin-bottom:1rem;}
    video{max-width:100%;height:auto;border:1px solid var(--border);border-radius:12px;}
    a{color:var(--accent5);text-decoration:none;}
    a:hover{color:var(--gold);}
  </style>
</head>
<body>
  <div class='wrap'>
    <h1>Support - MGOSC Sunday School Exam Portal</h1>
    <p>Below is a tutorial video to help you get started with the exam portal.</p>
    <video controls>
      <source src='videos/tutorial.mp4' type='video/mp4'>
      Your browser does not support the video tag.
    </video>
    <p><a href='index.html'>&larr; Back to Home</a></p>
  </div>
</body>
</html>
